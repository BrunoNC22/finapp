name: finapp

services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    # Roda com o dono dos dados do cofre (não como root).
    user: "${FINAPP_UID:-1000}:${FINAPP_GID:-1000}"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?defina MONGO_ROOT_USER no .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?defina MONGO_ROOT_PASSWORD no .env}
    volumes:
      - type: bind
        source: ${FINAPP_VAULT_MOUNT:?defina FINAPP_VAULT_MOUNT no .env}/mongo
        target: /data/db
        bind:
          # Se o cofre não estiver montado, o diretório não existe e o Mongo
          # NÃO sobe, em vez de gravar dados em claro fora do cofre.
          create_host_path: false
    networks: [data]
    # Sem "ports": o Mongo não é acessível fora da rede interna do compose.

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: finapp-api:local
    restart: unless-stopped
    depends_on: [mongo]
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Até a #10 criar um usuário próprio da aplicação, a API usa o usuário root do Mongo.
      MONGO_URL: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo:27017/?authSource=admin
      OPEN_FINANCE_PROVIDER: ${OPEN_FINANCE_PROVIDER:-demo}
      PLUGGY_CLIENT_ID: ${PLUGGY_CLIENT_ID:-}
      PLUGGY_CLIENT_SECRET: ${PLUGGY_CLIENT_SECRET:-}
      PLUGGY_ITEM_IDS: ${PLUGGY_ITEM_IDS:-}
    # "data": fala com o Mongo (rede interna). "egress": sai para a internet (Pluggy).
    networks: [data, egress]
    # Sem "ports": a exposição (só em 127.0.0.1 + tailscale serve) vem com a autenticação (#16/#21).

networks:
  # Rede sem saída para a internet; a API entra nela e também numa rede externa.
  data:
    internal: true
  egress: {}
