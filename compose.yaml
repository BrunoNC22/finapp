name: finapp

# Logs no disco do Docker (fora de qualquer repositório), com rotação: até 3 arquivos de 10 MB por serviço.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mongo:
    logging: *logging
    # Versão EXATA: versões 8.0 mais novas se recusam a iniciar em kernels Linux >= 6.19
    # (MongoDB SERVER-121912, TCMalloc/rseq). Não atualizar sem checar esse ticket.
    image: mongo:8.0.34
    restart: unless-stopped
    # Roda com o dono dos dados do cofre (não como root).
    user: "${FINAPP_UID:-1000}:${FINAPP_GID:-1000}"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?defina MONGO_ROOT_USER no .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?defina MONGO_ROOT_PASSWORD no .env}
    volumes:
      - type: bind
        source: ${FINAPP_VAULT_MOUNT:?defina FINAPP_VAULT_MOUNT no .env}/mongo
        target: /data/db
        bind:
          # Se o cofre não estiver montado, o diretório não existe e o Mongo
          # NÃO sobe, em vez de gravar dados em claro fora do cofre.
          create_host_path: false
    networks: [data]
    # Sem "ports": o Mongo não é acessível fora da rede interna do compose.

  api:
    logging: *logging
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: finapp-api:local
    restart: unless-stopped
    depends_on: [mongo]
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Usuário próprio da aplicação, com acesso só ao banco finapp (scripts/mongo-app-user.sh).
      MONGO_URL: mongodb://${MONGO_APP_USER:?defina MONGO_APP_USER}:${MONGO_APP_PASSWORD:?defina MONGO_APP_PASSWORD}@mongo:27017/finapp?authSource=finapp
      OPEN_FINANCE_PROVIDER: ${OPEN_FINANCE_PROVIDER:-demo}
      SYNC_INTERVAL_HOURS: ${SYNC_INTERVAL_HOURS:-6}
      SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-10}
      SESSION_MAX_HOURS: ${SESSION_MAX_HOURS:-12}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-localhost}
      WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN:-http://localhost:5173}
      PLUGGY_CLIENT_ID: ${PLUGGY_CLIENT_ID:-}
      PLUGGY_CLIENT_SECRET: ${PLUGGY_CLIENT_SECRET:-}
      PLUGGY_ITEM_IDS: ${PLUGGY_ITEM_IDS:-}
    # "data": fala com o Mongo (rede interna). "egress": sai para a internet (Pluggy).
    networks: [data, egress]
    # Sem "ports": a exposição (só em 127.0.0.1 + tailscale serve) vem com a autenticação (#16/#21).

  web:
    logging: *logging
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: finapp-web:local
    restart: unless-stopped
    depends_on: [api]
    # SÓ no loopback do host: o acesso externo é feito pelo `tailscale serve` (HTTPS da tailnet).
    ports: ["127.0.0.1:${FINAPP_WEB_PORT:-8080}:80"]
    networks: [egress]

networks:
  # Rede sem saída para a internet; a API entra nela e também numa rede externa.
  data:
    internal: true
  egress: {}
