name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: Varredura de segredos e dados pessoais
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          # Mesma versão do hook local (allowlists exigem >= 8.25).
          GITLEAKS_VERSION: 8.30.1

  quality:
    name: Lint, arquitetura, tipos, testes e build
    # Kernel < 6.19: o MongoDB 8.0 recusa kernels 6.19+ ainda sem a correção de rseq
    # (SERVER-121912). Os testes de integração usam a mesma versão da instância.
    runs-on: ubuntu-22.04
    steps:
      - run: uname -r
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome ci .
      - run: pnpm arch
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  image:
    name: Imagens Docker e compose do demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f apps/api/Dockerfile -t finapp-api:ci .
      - run: docker build -f apps/web/Dockerfile -t finapp-web:ci .
      - run: docker compose -f compose.demo.yaml config --quiet
